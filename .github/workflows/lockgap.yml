name: lockgap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockgap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Report what the GitHub Actions lockfile doesn't lock in this repository (job summary)
        uses: hamarshehmhmd/lockgap@fc56955cbdfbafe2dfe33dd25306b8b790d0b7e6 # v0.1.0
        with:
          fail-on: never
          args: --brief --no-info
