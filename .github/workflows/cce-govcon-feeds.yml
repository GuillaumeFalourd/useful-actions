name: CCE GovCon Feeds

# Example for chrisgrant303/gh-action-govcon-feeds@v1
# Marketplace: https://github.com/marketplace/actions/cce-govcon-feeds-apify
#
# Needs repository secret APIFY_TOKEN. Runs bill to that Apify account under each
# Actor's pay-per-event pricing. workflow_dispatch only so PR/push CI does not
# fail when the secret is absent (this repo's other examples use the same pattern).
#
# Map the secret to a job env var: GitHub does not allow the secrets context in
# step `if` expressions, so we test env.APIFY_TOKEN instead.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - name: How to run
        if: ${{ env.APIFY_TOKEN == '' }}
        run: |
          echo "Set repository secret APIFY_TOKEN, then re-run this workflow."
          echo "Runs bill to your Apify account (pay-per-event per Actor)."
          echo "Docs: https://github.com/chrisgrant303/gh-action-govcon-feeds"

      - name: CCE GovCon Feeds (SAM.gov sample)
        id: feed
        if: ${{ env.APIFY_TOKEN != '' }}
        uses: chrisgrant303/gh-action-govcon-feeds@v1
        with:
          apify-token: ${{ secrets.APIFY_TOKEN }}
          actor: sam
          max-items: '5'
          output-format: csv
